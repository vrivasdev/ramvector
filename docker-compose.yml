services:
  ramvector-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ramvector-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      # Mount host directory for instant live editing
      - .:/app
      # Anonymous volume to isolate container-native Linux node_modules
      - /app/node_modules
    stdin_open: true
    tty: true
